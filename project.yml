name: Chap
options:
  bundleIdPrefix: com.mingyupark
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

targets:
  Chap:
    type: application
    platform: macOS
    sources:
      - path: Sources/Chap
      - path: Sources/ChapCore
      - path: Resources/AppIcon.icns
        buildPhase: resources
      - path: Resources/StatusBarIcon.png
        buildPhase: resources
    info:
      path: Sources/Chap/Info.plist
      properties:
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppleEventsUsageDescription: "Chap controls Finder to open folders and position Finder windows at the size and location you set."
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mingyupark.Chap
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_CFBundleDisplayName: Chap
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Team Chap"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
      configs:
        Release:
          DEVELOPMENT_TEAM: JC4BNFSKBN
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_ENTITLEMENTS: Sources/Chap/Chap.entitlements
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: "--timestamp"

  ChapTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ChapCoreTests
    dependencies:
      - target: Chap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mingyupark.ChapTests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"

schemes:
  Chap:
    build:
      targets:
        Chap: all
        ChapTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ChapTests
