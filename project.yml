name: Chap
options:
  bundleIdPrefix: com.mingyupark
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

targets:
  Chap:
    type: application
    platform: macOS
    sources:
      - path: Sources/Chap
      - path: Sources/ChapCore
      - path: Resources/AppIcon.icns
        buildPhase: resources
      - path: Resources/StatusBarIcon.png
        buildPhase: resources
    info:
      path: Sources/Chap/Info.plist
      properties:
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppleEventsUsageDescription: "Chap controls Chrome to reuse matching URL windows and Finder to open and position folder windows."
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        SUFeedURL: "https://milv0.github.io/Chap/appcast.xml"
        SUPublicEDKey: "3RRsmvZE5JAXnPjxynxsphkCltJtZb9ldZb/HjsZyJM="
        SUEnableAutomaticChecks: false
    dependencies:
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mingyupark.Chap
        MARKETING_VERSION: "1.1.6"
        CURRENT_PROJECT_VERSION: "16"
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_CFBundleDisplayName: Chap
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Team Chap"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
      configs:
        Release:
          DEVELOPMENT_TEAM: JC4BNFSKBN
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_ENTITLEMENTS: Sources/Chap/Chap.entitlements
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: "--timestamp"

  ChapTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ChapCoreTests
    dependencies:
      - target: Chap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mingyupark.ChapTests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6

schemes:
  Chap:
    build:
      targets:
        Chap: all
        ChapTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ChapTests
